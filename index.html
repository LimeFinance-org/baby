<script>
  (function(){
    var tracks = [
      { src: 'assets/audio/gem-11.mp3', name: 'G.E.M. - 11', lyrics: 'assets/lyrics/11.lrc' },
      { src: 'assets/audio/uu-na-girl-said-to-me.mp3', name: 'Uu - 那女孩对我说', lyrics: 'assets/lyrics/na-girl-said-to-me.lrc' }
    ];
    var audio = document.querySelector('#site-music');
    var button = document.querySelector('#music-player-button');
    var prevButton = document.querySelector('#music-player-prev');
    var nextButton = document.querySelector('#music-player-next');
    var icon = document.querySelector('#music-player-icon');
    var name = document.querySelector('#music-player-name');
    var lyricText = document.querySelector('#music-player-lyric');
    var progress = document.querySelector('#music-player-progress');
    var playerCard = document.querySelector('#music-player-card');
    var video = document.querySelector('.cover__paper-video');
    var videoAudio = document.querySelector('#site-video-audio');
    var unmuteButton = document.querySelector('#paper-video-unmute');
    var order = [];
    var currentIndex = -1;
    var currentTrack = null;
    var lyricEntries = [];
    var currentLyricIndex = -1;
    var lyricRequestId = 0;
    var isProgressDragging = false;
    var videoSoundEnabled = false;
    var videoAudioFallback = false;
    var videoPlaybackWanted = true;
    var videoAudioSourceReady = false;
    var videoResumeTimer = 0;
    var videoResumeAttempts = 0;

    function formatTime(seconds) {
      var value = Number(seconds);
      if (!isFinite(value) || value < 0) value = 0;
      var minutes = Math.floor(value / 60);
      var remainder = Math.floor(value % 60);
      return minutes + ':' + (remainder < 10 ? '0' : '') + remainder;
    }

    function updateProgress() {
      if (!progress || !audio) return;
      var duration = Number(audio.duration);
      var currentTime = Number(audio.currentTime);
      if (!isFinite(duration) || duration <= 0) {
        progress.max = '0';
        progress.value = '0';
        if (playerCard) playerCard.style.setProperty('--progress', '0%');
        progress.setAttribute('aria-valuetext', '0:00 / 0:00');
        return;
      }
      var percentage = Math.min(100, Math.max(0, (currentTime / duration) * 100));
      progress.max = String(duration);
      progress.value = String(Math.min(duration, Math.max(0, currentTime)));
      if (playerCard) playerCard.style.setProperty('--progress', percentage + '%');
      progress.setAttribute('aria-valuetext', formatTime(currentTime) + ' / ' + formatTime(duration));
    }

    function seekMusic(value) {
      if (!audio) return;
      var duration = Number(audio.duration);
      var target = Number(value);
      if (!isFinite(duration) || duration <= 0 || !isFinite(target)) return;
      audio.currentTime = Math.min(duration, Math.max(0, target));
      updateProgress();
    }

    function seekFromPointer(event) {
      if (!playerCard || !audio) return;
      var duration = Number(audio.duration);
      var rect = playerCard.getBoundingClientRect();
      if (!isFinite(duration) || duration <= 0 || !rect.width) return;
      var ratio = (event.clientX - rect.left) / rect.width;
      seekMusic(duration * Math.min(1, Math.max(0, ratio)));
    }

    function shuffle(items) {
      for (var i = items.length - 1; i > 0; i -= 1) {
        var j = Math.floor(Math.random() * (i + 1));
        var temp = items[i];
        items[i] = items[j];
        items[j] = temp;
      }
      return items;
    }

    function updateMusicState(isPlaying) {
      if (icon) {
        icon.textContent = '';
        icon.classList.toggle('is-playing', isPlaying);
        icon.classList.toggle('is-paused', !isPlaying);
      }
      if (button) {
        button.setAttribute('aria-pressed', isPlaying ? 'true' : 'false');
        button.setAttribute('aria-label', isPlaying ? '暂停' : '播放');
      }
    }

    function updateVideoSoundButton(isEnabled) {
      if (!unmuteButton) return;
      unmuteButton.classList.toggle('is-enabled', !!isEnabled);
      unmuteButton.setAttribute('aria-pressed', isEnabled ? 'true' : 'false');
      unmuteButton.setAttribute('aria-label', isEnabled ? '视频声音已开启' : '解除视频静音');
      unmuteButton.setAttribute('title', isEnabled ? '视频声音已开启' : '解除视频静音');
    }

    function setLyricText(message) {
      if (lyricText) lyricText.textContent = message || '';
    }

    function parseLrc(text) {
      var entries = [];
      var metadataPattern = /^(作词|作曲|词|曲|改编词曲|制作人|编曲|吉他|贝斯|和声|和声编写|录音|混音|母带(?:工程)?|录音棚|混音棚|监制|OP|SP|发行)\s*[:：]/i;
      var timestampPattern = /\[(\d+):(\d{2})(?:[.:](\d{1,3}))?\](.*)/g;
      String(text || '').split(/\r?\n/).forEach(function(rawLine) {
        timestampPattern.lastIndex = 0;
        var match;
        while ((match = timestampPattern.exec(rawLine)) !== null) {
          var fraction = match[3] || '';
          var milliseconds = Number((fraction + '00').slice(0, 3));
          var lyric = match[4].trim();
          if (!lyric || metadataPattern.test(lyric)) continue;
          if (!entries.length && (lyric.indexOf(' - ') !== -1 || /\(完整版\)$/.test(lyric))) continue;
          entries.push({
            time: Number(match[1]) * 60 + Number(match[2]) + milliseconds / 1000,
            text: lyric
          });
        }
      });
      return entries.sort(function(a, b) { return a.time - b.time; });
    }

    function syncLyrics(currentTime, force) {
      if (!lyricText || !lyricEntries.length) return;
      var nextIndex = -1;
      for (var i = 0; i < lyricEntries.length; i += 1) {
        if (currentTime + 0.02 >= lyricEntries[i].time) nextIndex = i;
        else break;
      }
      var displayIndex = nextIndex >= 0 ? nextIndex : 0;
      if (!force && displayIndex === currentLyricIndex) return;
      currentLyricIndex = displayIndex;
      setLyricText(lyricEntries[displayIndex].text);
    }

    function renderLyrics(entries) {
      lyricEntries = entries || [];
      currentLyricIndex = -1;
      if (!lyricEntries.length) {
        setLyricText('暂无歌词');
        return;
      }
      syncLyrics(audio ? audio.currentTime : 0, true);
    }

    function loadLyrics(track) {
      var requestId = ++lyricRequestId;
      lyricEntries = [];
      currentLyricIndex = -1;
      setLyricText('歌词加载中…');
      if (!track || !track.lyrics) {
        setLyricText('暂无歌词');
        return;
      }
      fetch(track.lyrics)
        .then(function(response) {
          if (!response.ok) throw new Error('歌词加载失败');
          return response.text();
        })
        .then(function(text) {
          if (requestId !== lyricRequestId) return;
          renderLyrics(parseLrc(text));
        })
        .catch(function() {
          if (requestId === lyricRequestId) renderLyrics([]);
        });
    }

    function buildOrder() {
      order = shuffle(tracks.map(function(_, index) { return index; }));
      currentIndex = -1;
    }

    function selectTrack(index, shouldPlay) {
      if (!tracks.length) return;
      if (!order.length) buildOrder();
      currentIndex = (index + order.length) % order.length;
      currentTrack = tracks[order[currentIndex]];
      if (audio) audio.src = currentTrack.src;
      updateProgress();
      if (name) name.textContent = currentTrack.name;
      loadLyrics(currentTrack);
      if (shouldPlay) playMusic();
    }

    function chooseNextTrack(shouldPlay) {
      if (!tracks.length) return;
      if (!order.length) buildOrder();
      var nextIndex = currentIndex + 1;
      if (nextIndex >= order.length) {
        buildOrder();
        nextIndex = 0;
      }
      selectTrack(nextIndex, shouldPlay);
    }

    function choosePreviousTrack() {
      if (!tracks.length) return;
      if (!order.length) buildOrder();
      var previousIndex = currentIndex - 1;
      if (previousIndex < 0) previousIndex = order.length - 1;
      selectTrack(previousIndex, true);
    }

    function ensureVideoAudioSource() {
      if (!videoAudio || videoAudioSourceReady) return;
      videoAudio.src = 'assets/video/paper-video.mp4';
      videoAudio.preload = 'auto';
      videoAudio.loop = true;
      videoAudioSourceReady = true;
    }

    function syncVideoAudioPosition() {
      if (!video || !videoAudio || !videoSoundEnabled || videoAudioFallback) return;
      var videoTime = Number(video.currentTime);
      var audioTime = Number(videoAudio.currentTime);
      if (!isFinite(videoTime) || !isFinite(audioTime)) return;
      if (Math.abs(videoTime - audioTime) > 0.35) {
        try { video.currentTime = audioTime; } catch (_) {}
      }
    }

    function scheduleVideoResume() {
      if (!video || document.hidden || !videoPlaybackWanted || videoResumeTimer) return;
      if (videoResumeAttempts >= 4) return;
      videoResumeTimer = setTimeout(function() {
        videoResumeTimer = 0;
        if (!video || document.hidden || !videoPlaybackWanted || !video.paused) {
          videoResumeAttempts = 0;
          return;
        }
        videoResumeAttempts += 1;
        resumeVideoPlayback();
        if (video.paused) scheduleVideoResume();
      }, 80);
    }

    function playMusic() {
      if (!audio) return;
      if (!audio.src) chooseNextTrack(false);
      videoSoundEnabled = false;
      videoAudioFallback = false;
      updateVideoSoundButton(false);
      videoPlaybackWanted = true;
      videoResumeAttempts = 0;
      if (videoAudio) videoAudio.pause();
      if (video) {
        video.muted = true;
        if (video.paused) {
          var videoPromise = video.play();
          if (videoPromise && videoPromise.catch) videoPromise.catch(function() {});
        }
      }
      var promise = audio.play();
      if (promise && promise.catch) {
        promise.catch(function() { updateMusicState(false); });
      }
    }

    function playVideoWithSound(preferNativeSound) {
      if (!video) return;
      // Page taps/swipes must not interrupt a manually started music track.
      // The music button pauses it explicitly before switching to video audio.
      if (audio && !audio.paused) return;
      videoSoundEnabled = true;
      videoAudioFallback = preferNativeSound !== false;
      updateVideoSoundButton(true);
      videoPlaybackWanted = true;
      videoResumeAttempts = 0;
      ensureVideoAudioSource();
      video.muted = !videoAudioFallback;
      var videoPromise = video.play();
      if (videoPromise && videoPromise.catch) videoPromise.catch(function() {});
      if (!videoAudio) {
        video.muted = false;
        return;
      }
      if (!videoAudio.paused) {
        videoAudioFallback = false;
        video.muted = true;
        return;
      }
      var videoTime = Number(video.currentTime);
      if (isFinite(videoTime) && videoAudio.readyState >= 1) {
        try { videoAudio.currentTime = videoTime; } catch (_) {}
      }
      var audioPromise = videoAudio.play();
      if (audioPromise && audioPromise.then) {
        audioPromise.then(function() {
          if (!videoSoundEnabled) return;
          videoAudioFallback = false;
          video.muted = true;
          var restart = video.play();
          if (restart && restart.catch) restart.catch(function() {});
        });
      }
      if (audioPromise && audioPromise.catch) {
        audioPromise.catch(function() {
          // If the browser rejects the separate audio element, retry the
          // original video audio while this same gesture is still active.
          videoSoundEnabled = true;
          if (preferNativeSound === false) {
            videoAudioFallback = true;
            video.muted = false;
          }
          var fallback = video.play();
          if (fallback && fallback.catch) fallback.catch(function() {});
        });
      }
    }

    function resumeVideoPlayback() {
      if (!video || document.hidden || !video.paused) return;
      if (videoSoundEnabled) video.muted = !videoAudioFallback;
      var promise = video.play();
      if (promise && promise.catch) promise.catch(function() {});
    }

    function tryVideoAutoplayWithSound() {
      if (!video) return;
      video.muted = false;
      var promise = video.play();
      if (promise && promise.catch) {
        promise.catch(function() {
          video.muted = true;
          var fallback = video.play();
          if (fallback && fallback.catch) fallback.catch(function() {});
        });
      }
    }

    if (audio) {
      chooseNextTrack(false);
      audio.addEventListener('play', function() {
        if (video) video.muted = true;
        updateMusicState(true);
      });
      audio.addEventListener('pause', function() {
        updateMusicState(false);
      });
      audio.addEventListener('timeupdate', function() {
        updateProgress();
        syncLyrics(audio.currentTime, false);
      });
      audio.addEventListener('loadedmetadata', function() {
        updateProgress();
        syncLyrics(audio.currentTime, true);
      });
      audio.addEventListener('durationchange', updateProgress);
      audio.addEventListener('seeked', function() {
        updateProgress();
        syncLyrics(audio.currentTime, true);
      });
      audio.addEventListener('ended', function() {
        chooseNextTrack(true);
      });
    }

    if (progress) {
      progress.addEventListener('input', function() {
        seekMusic(progress.value);
      });
      progress.addEventListener('change', function() {
        seekMusic(progress.value);
      });
    }

    if (playerCard) {
      playerCard.addEventListener('pointerdown', function(event) {
        if (event.target && event.target.closest && event.target.closest('button')) return;
        isProgressDragging = true;
        if (playerCard.setPointerCapture && event.pointerId !== undefined) {
          try { playerCard.setPointerCapture(event.pointerId); } catch (_) {}
        }
        seekFromPointer(event);
        event.preventDefault();
      });
      playerCard.addEventListener('pointermove', function(event) {
        if (!isProgressDragging) return;
        seekFromPointer(event);
        event.preventDefault();
      });
      function stopProgressDrag(event) {
        if (!isProgressDragging) return;
        seekFromPointer(event);
        isProgressDragging = false;
        if (playerCard.releasePointerCapture && event.pointerId !== undefined) {
          try { playerCard.releasePointerCapture(event.pointerId); } catch (_) {}
        }
      }
      playerCard.addEventListener('pointerup', stopProgressDrag);
      playerCard.addEventListener('pointercancel', stopProgressDrag);
      playerCard.addEventListener('lostpointercapture', function() {
        isProgressDragging = false;
      });
    }

    if (video) {
      video.addEventListener('pause', function() {
        if (!document.hidden && videoPlaybackWanted) scheduleVideoResume();
      });
      video.addEventListener('timeupdate', syncVideoAudioPosition);
      video.addEventListener('loadedmetadata', syncVideoAudioPosition);
    }

    if (videoAudio) {
      videoAudio.addEventListener('loadedmetadata', syncVideoAudioPosition);
      videoAudio.addEventListener('timeupdate', syncVideoAudioPosition);
      videoAudio.addEventListener('pause', function() {
        if (videoSoundEnabled && !videoAudioFallback && !document.hidden) {
          var promise = videoAudio.play();
          if (promise && promise.catch) promise.catch(function() {});
        }
      });
    }

    if (unmuteButton) {
      unmuteButton.addEventListener('click', function(event) {
        event.preventDefault();
        event.stopPropagation();
        playVideoWithSound();
      });
    }

    if (button) {
      button.addEventListener('click', function(event) {
        event.preventDefault();
        if (audio && audio.paused) {
          playMusic();
        } else if (audio) {
          audio.pause();
          playVideoWithSound();
        }
      });
    }

    if (prevButton) {
      prevButton.addEventListener('click', function(event) {
        event.preventDefault();
        choosePreviousTrack();
      });
    }

    if (nextButton) {
      nextButton.addEventListener('click', function(event) {
        event.preventDefault();
        chooseNextTrack(true);
      });
    }

    tryVideoAutoplayWithSound();

    ['click', 'keydown'].forEach(function(eventName) {
      document.addEventListener(eventName, function(event) {
        if (event.target && event.target.closest && event.target.closest('#music-player-card')) return;
        playVideoWithSound();
      }, { passive: eventName !== 'keydown' });
    });

    var touchStartX = 0;
    var touchStartY = 0;
    var touchStartedInMusicCard = false;
    var touchMovedVertically = false;
    var pointerStartX = 0;
    var pointerStartY = 0;
    var pointerStartedInMusicCard = false;
    var pointerMovedVertically = false;
    var touchGestureActive = false;
    var pointerGestureActive = false;
    function isVerticalGesture(deltaX, deltaY) {
      return Math.abs(deltaY) >= 8 && Math.abs(deltaY) > Math.abs(deltaX);
    }
    var gestureListenerOptions = { passive: true, capture: true };
    window.addEventListener('touchstart', function(event) {
      var touch = event.touches && event.touches[0];
      if (!touch) return;
      touchStartX = touch.clientX;
      touchStartY = touch.clientY;
      touchStartedInMusicCard = !!(event.target && event.target.closest && event.target.closest('#music-player-card'));
      touchMovedVertically = false;
      touchGestureActive = true;
      if (!touchStartedInMusicCard) playVideoWithSound(true);
    }, gestureListenerOptions);
    window.addEventListener('touchmove', function(event) {
      // A vertical swipe that starts over the music row should still unlock
      // video audio; only a click or horizontal progress drag belongs to the
      // music player.
      if (touchMovedVertically) return;
      var touch = event.touches && event.touches[0];
      if (!touch) return;
      var deltaX = touch.clientX - touchStartX;
      var deltaY = touch.clientY - touchStartY;
      if (isVerticalGesture(deltaX, deltaY)) {
        touchMovedVertically = true;
        playVideoWithSound(true);
      }
    }, gestureListenerOptions);
    window.addEventListener('touchend', function(event) {
      var touch = event.changedTouches && event.changedTouches[0];
      var isVertical = false;
      if (touch) {
        var deltaX = touch.clientX - touchStartX;
        var deltaY = touch.clientY - touchStartY;
        isVertical = isVerticalGesture(deltaX, deltaY);
      }
      touchStartedInMusicCard = false;
      touchGestureActive = false;
      if (isVertical) playVideoWithSound(true);
      touchMovedVertically = false;
    }, gestureListenerOptions);
    window.addEventListener('touchcancel', function() {
      touchStartedInMusicCard = false;
      touchMovedVertically = false;
      touchGestureActive = false;
    }, gestureListenerOptions);

    // Some mobile browsers expose touch scrolling only through Pointer Events.
    // Capture those gestures as well so a swipe can unlock the media element.
    window.addEventListener('pointerdown', function(event) {
      if (event.pointerType !== 'touch') return;
      pointerStartX = event.clientX;
      pointerStartY = event.clientY;
      pointerStartedInMusicCard = !!(event.target && event.target.closest && event.target.closest('#music-player-card'));
      pointerMovedVertically = false;
      pointerGestureActive = true;
      if (!pointerStartedInMusicCard) playVideoWithSound(true);
    }, gestureListenerOptions);
    window.addEventListener('pointermove', function(event) {
      if (event.pointerType !== 'touch' || pointerMovedVertically) return;
      var deltaX = event.clientX - pointerStartX;
      var deltaY = event.clientY - pointerStartY;
      if (isVerticalGesture(deltaX, deltaY)) {
        pointerMovedVertically = true;
        playVideoWithSound(true);
      }
    }, gestureListenerOptions);
    window.addEventListener('pointerup', function(event) {
      if (event.pointerType !== 'touch') return;
      var deltaX = event.clientX - pointerStartX;
      var deltaY = event.clientY - pointerStartY;
      if (isVerticalGesture(deltaX, deltaY)) playVideoWithSound(true);
      pointerStartedInMusicCard = false;
      pointerMovedVertically = false;
      pointerGestureActive = false;
    }, gestureListenerOptions);
    window.addEventListener('pointercancel', function(event) {
      if (event.pointerType !== 'touch') return;
      pointerStartedInMusicCard = false;
      pointerMovedVertically = false;
      pointerGestureActive = false;
    }, gestureListenerOptions);

    window.addEventListener('scroll', function() {
      // A few embedded browsers omit touchend/pointerup while settling a
      // scroll. The first scroll event is still part of that gesture, so use
      // it as a final unlock attempt before the browser can suspend media.
      if (!videoSoundEnabled && (touchGestureActive || pointerGestureActive ||
          (window.matchMedia && window.matchMedia('(pointer: coarse)').matches))) {
        playVideoWithSound(true);
      }
      resumeVideoPlayback();
      if (videoSoundEnabled && !videoAudioFallback && videoAudio && videoAudio.paused && !document.hidden) {
        var promise = videoAudio.play();
        if (promise && promise.catch) promise.catch(function() {});
      }
    }, { passive: true });
    document.addEventListener('visibilitychange', function() {
      if (!document.hidden) {
        resumeVideoPlayback();
        if (videoSoundEnabled && !videoAudioFallback && videoAudio && videoAudio.paused) {
          var promise = videoAudio.play();
          if (promise && promise.catch) promise.catch(function() {});
        }
      }
    });

    updateMusicState(false);
    updateVideoSoundButton(false);
    updateProgress();
  })();
</script>
